{% extends "studio_base.html" %}
{% block title %}자막 스타일｜스튜디오{% endblock %}
{% block body %}
<style>
.w{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:360px 1fr;gap:16px}
@media(max-width:900px){.w{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:8px 0}
label span{color:#555}
select,input[type=number],input[type=text]{width:170px;border:1px solid #ccc;border-radius:6px;padding:4px 6px}
input[type=range]{width:170px}
.pre{display:flex;flex-wrap:wrap;gap:6px}
button{padding:7px 12px;border-radius:8px;border:1px solid #1a3d7c;background:#fff;color:#1a3d7c;font-weight:bold;cursor:pointer}
button.pri{background:#1a3d7c;color:#fff}
img{width:100%;border-radius:8px;border:1px solid #ccc}
.hint{font-size:12px;color:#777}
h3{margin:4px 0 8px;color:#1a3d7c;font-size:15px}
</style>
<div class="w">
<div class="card">
  <h3>프리셋</h3>
  <div class="pre">{% for k, p in presets.items() %}<button onclick="preset('{{ k }}')">{{ p.label }}</button>{% endfor %}</div>
  <h3 style="margin-top:14px">글자</h3>
  <label><span>글꼴 (굵기 포함)</span><select id="font">{% for f in fonts %}<option>{{ f }}</option>{% endfor %}</select></label>
  <label><span>크기 <b id="v_size"></b></span><input type="range" id="size" min="34" max="72"></label>
  <label><span>글자 색</span><input type="color" id="color"></label>
  <label><span>테두리 두께 <b id="v_stroke"></b></span><input type="range" id="stroke" min="0" max="10"></label>
  <label><span>테두리 색</span><input type="color" id="stroke_color"></label>
  <label><span>그림자</span><input type="checkbox" id="shadow"></label>
  <h3 style="margin-top:14px">배경 박스</h3>
  <label><span>박스 깔기</span><input type="checkbox" id="box"></label>
  <label><span>박스 색</span><input type="color" id="box_color"></label>
  <label><span>진하기 <b id="v_box_alpha"></b></span><input type="range" id="box_alpha" min="0" max="1" step="0.05"></label>
  <label><span>모서리 둥글기 <b id="v_box_radius"></b></span><input type="range" id="box_radius" min="0" max="30"></label>
  <h3 style="margin-top:14px">끊기·위치</h3>
  <label><span>한 화면 최대 글자 수 <b id="v_max_chars"></b></span><input type="range" id="max_chars" min="10" max="30"></label>
  <label><span>최대 줄 수</span><select id="max_lines"><option value="1">1줄</option><option value="2">2줄</option></select></label>
  <label><span>아래에서의 위치 <b id="v_bottom"></b></span><input type="range" id="bottom" min="20" max="200"></label>
  <h3 style="margin-top:14px">슬라이드 본문 글꼴</h3>
  <label><span>글꼴</span><select id="slide_font">{% for f in slide_fonts %}<option>{{ f }}</option>{% endfor %}</select></label>
  <p class="hint">자막은 문장이 끊기는 곳(、나 조사 뒤)에서 나누고, 최대 글자 수를 넘지 않게 한 장씩 보여줍니다. 바꾸면 다음 출력부터 모든 슬라이드에 반영됩니다.</p>
  <button class="pri" onclick="send(true)">저장</button> <button onclick="send(false)">견본만 갱신</button> <span id="msg" class="hint"></span>
</div>
<div class="card"><h3>견본 (실제 슬라이드에 겹친 모습)</h3><img id="sample" alt="견본"></div>
</div>
<script>
const PRESETS = {{ presets|tojson }};
let ST = {{ style|tojson }};
const F = ["font","size","color","stroke","stroke_color","shadow","box","box_color","box_alpha","box_radius","max_chars","max_lines","bottom","slide_font"];
function fill(){ F.forEach(k => { const el = document.getElementById(k); if (!el) return;
  if (el.type === "checkbox") el.checked = !!ST[k]; else el.value = ST[k];
  const v = document.getElementById("v_" + k); if (v) v.textContent = ST[k]; }); }
function read(){ F.forEach(k => { const el = document.getElementById(k);
  ST[k] = el.type === "checkbox" ? el.checked : (el.type === "range" || k === "max_lines" ? +el.value : el.value);
  const v = document.getElementById("v_" + k); if (v) v.textContent = ST[k]; }); }
function preset(k){ const sf = ST.slide_font; ST = {...PRESETS[k], preset:k, slide_font:sf}; delete ST.label; fill(); send(false); }
let t = null;
F.forEach(k => document.getElementById(k).addEventListener("input", () => { read(); clearTimeout(t); t = setTimeout(() => send(false), 400); }));
async function send(saveIt){
  read(); document.getElementById("msg").textContent = "갱신 중…";
  const r = await fetch("/studio/api/style" + (saveIt ? "?save=1" : ""), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(ST)});
  const d = await r.json(); document.getElementById("sample").src = "/studio/style/sample/" + d.sample;
  document.getElementById("msg").textContent = saveIt ? "저장했습니다" : "";
}
fill(); send(false);
</script>
{% endblock %}

{% extends "studio_base.html" %}
{% block title %}로그인｜스튜디오{% endblock %}
{% block body %}
<div style="max-width:360px;margin:60px auto;background:#fff;border-radius:10px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.1)">
  <h2 style="margin-top:0">로그인</h2>
  {% if error %}<p style="color:#c0392b">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="password" name="password" autofocus autocomplete="current-password" placeholder="비밀번호"
           style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px">
    <p><button type="submit" style="width:100%;padding:10px;border:0;border-radius:8px;background:#1a3d7c;color:#fff;font-weight:bold;font-size:16px">들어가기</button></p>
  </form>
</div>
{% endblock %}
